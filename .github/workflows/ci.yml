name: CI

on:
  push:
    branches: [master, "cursor/**", "refactor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Verify
        run: ant test
